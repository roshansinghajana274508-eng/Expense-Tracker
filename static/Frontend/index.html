
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Expense Tracker</h1>
            <p>Manage your daily expenses smartly</p>
        </header>

        <section class="dashboard">
            <div class="card">
                <h3>Total Expenses</h3>
                <h2 id="total">₹0</h2>
            </div>
            <div class="card">
                <h3>Transactions</h3>
                <h2 id="count">0</h2>
            </div>
        </section>

        <section class="form-section">
            <h2>Add New Expense</h2>

            <form id="expenseForm">
                <input type="date" id="date" required>

                <input type="text"
                       id="category"
                       placeholder="Category (Food, Travel...)"
                       required>

                <input type="text"
                       id="description"
                       placeholder="Description"
                       required>

                <input type="number"
                       id="amount"
                       placeholder="Amount"
                       min="0.01"
                       step="0.01"
                       required>

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section class="expense-section">
            <h2>Recent Expenses</h2>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Category</th>
                            <th>Description</th>
                            <th>Amount</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="expenseList">
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
